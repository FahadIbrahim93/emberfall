<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMBERFALL — world stats &amp; leaderboard</title>
<style>
:root{--bg:#0b0d14;--panel:#12141d;--line:#232736;--ink:#e8e6e0;--dim:#8b8fa0;--ember:#ff8a2b;--crimson:#b82c3a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Chakra Petch",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px}
h1{font-family:Michroma,system-ui,sans-serif;font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:.12em;margin-bottom:4px}
h1 .ember{color:var(--ember)}
.sub{color:var(--dim);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:32px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:100%;max-width:760px;margin-bottom:36px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;text-align:center}
.card .n{font-family:Michroma,system-ui,sans-serif;font-size:1.7rem;color:var(--ember)}
.card .l{color:var(--dim);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
h2{font-family:Michroma,system-ui,sans-serif;font-size:.9rem;letter-spacing:.16em;color:var(--dim);margin:8px 0 12px;width:100%;max-width:760px}
.board{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px}
.row{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:.92rem}
.row:first-child{border-top:0}
.row .rank{color:var(--dim);font-size:.78rem}
.row .name{font-weight:600;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .wf{color:var(--ember);font-size:.8rem}
.row .score{font-family:Michroma,system-ui,sans-serif;font-size:.95rem}
.empty{color:var(--dim);padding:22px 16px;text-align:center;font-size:.9rem}
.days{width:100%;max-width:760px;display:grid;gap:8px}
.day{display:grid;grid-template-columns:1fr auto auto;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:.9rem;align-items:center}
.day .d{color:var(--dim);letter-spacing:.06em}
.day .p{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .s{font-family:Michroma,system-ui,sans-serif;color:var(--ember)}
footer{margin-top:40px;color:var(--dim);font-size:.8rem;display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
footer a{color:var(--ember);text-decoration:none}
.err{background:rgba(184,44,58,.12);border:1px solid var(--crimson);border-radius:10px;padding:14px 18px;max-width:760px;color:var(--ink);font-size:.9rem;display:none}
</style>
</head>
<body>
<h1>EMBER<span class="ember">FALL</span></h1>
<p class="sub">world stats &amp; leaderboard — read-only public mirror</p>
<div class="err" id="err"></div>
<div class="cards" id="cards">
  <div class="card"><div class="n" id="cPilots">—</div><div class="l">pilots</div></div>
  <div class="card"><div class="n" id="cRuns">—</div><div class="l">runs ranked</div></div>
  <div class="card"><div class="n" id="cTop">—</div><div class="l">top score</div></div>
</div>
<h2>Global leaderboard — best per pilot</h2>
<div class="board" id="board"><div class="empty">loading…</div></div>
<h2>Daily gauntlet — recent days</h2>
<div class="days" id="days"><div class="day"><span class="d">loading…</span></div></div>
<footer>
  <a href="index.html">▶ play the game</a>
  <a href="https://github.com/FahadIbrahim93/emberfall">repository</a>
  <span>the deck's SQLite is authoritative; this page reads a locked, anon-read-only mirror</span>
</footer>
<script>
'use strict';
const SB = 'https://bhcczyyhadornihhzpsu.supabase.co';
const KEY = 'sb_publishable_rcBoR0FTobKUc_2-QqH2fQ_jS4mqd5O';
const get = (path) => fetch(SB + path, { headers: { apikey: KEY } }).then(r => {
  if (!r.ok) throw new Error('mirror answered ' + r.status);
  return r.json();
});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async () => {
  try {
    const [stats, board, days] = await Promise.all([
      get('/rest/v1/deck_stats?select=pilots,runs,top_score'),
      get('/rest/v1/leaderboard?select=*'),
      get('/rest/v1/gauntlet_days?select=day,pilots,runs,top_score,top_pilot&order=day.desc&limit=8')
    ]);
    if (stats.length) {
      document.getElementById('cPilots').textContent = stats[0].pilots;
      document.getElementById('cRuns').textContent = stats[0].runs;
      document.getElementById('cTop').textContent = stats[0].top_score;
    }
    const b = document.getElementById('board');
    if (!board.length) { b.innerHTML = '<div class="empty">no ranked runs yet — be the first: press ▶ play the game</div>'; }
    else {
      b.innerHTML = board.map((r, i) =>
        '<div class="row"><span class="rank">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="name">' + esc(r.callsign) + (r.wardenfalls ? ' <span class="wf">✦' + r.wardenfalls + '</span>' : '') + '</span>' +
        '<span class="wf">' + r.runs + (r.runs === 1 ? ' run' : ' runs') + '</span>' +
        '<span class="score">' + esc(r.best_score) + '</span></div>').join('');
    }
    const d = document.getElementById('days');
    if (!days.length) { d.innerHTML = '<div class="day"><span class="d">no gauntlet days flown yet</span></div>'; }
    else {
      d.innerHTML = days.map(x =>
        '<div class="day"><span class="d">' + esc(x.day) + ' · ' + x.pilots + ' pilot' + (x.pilots === 1 ? '' : 's') + '</span>' +
        '<span class="p">' + esc(x.top_pilot || '—') + '</span>' +
        '<span class="s">' + esc(x.top_score) + '</span></div>').join('');
    }
  } catch (e) {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'The public mirror is not answering right now (' + e.message + '). The game itself never depends on it — play on.';
    document.getElementById('board').innerHTML = '<div class="empty">unavailable</div>';
  }
})();
</script>
</body>
</html>
