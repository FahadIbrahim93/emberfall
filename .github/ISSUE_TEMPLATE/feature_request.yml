name: Feature request
description: An idea for the game or the deck
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and who is it for?
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: How would we test it? (optional)
      description: |
        Behaviour changes ship with a check (see CONTRIBUTING.md). If you
        know which test or drill would cover it, mention it here.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Game client (index.html / js/)
        - Command deck (server.js)
        - Tools / CI / battery
        - Docs
        - Multiple
    validations:
      required: true
