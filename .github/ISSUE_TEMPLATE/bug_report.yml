name: Bug report
description: Something in the game or the deck behaves wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for flying. If this is a security issue (auth, sessions,
        score integrity), please use a private security advisory instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Live game (GitHub Pages)
        - Self-hosted deck (server.js)
        - Local file (file://)
        - Tools / CI
        - Docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, and whether a battery check (smoke/drill/selftest) catches it
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build / version
      description: The footline version, or the commit/tag
