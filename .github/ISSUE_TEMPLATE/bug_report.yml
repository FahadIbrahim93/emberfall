name: Bug report
description: Something in the game or the deck isn't working right
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a security issue (sign-in, sessions,
        score integrity), please use a private security advisory instead:
        https://github.com/FahadIbrahim93/emberfall/security/advisories/new
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Live game (Vercel)
        - Live game (GitHub Pages)
        - Portal build
        - Self-hosted deck (server.js)
        - Local file (file://)
        - Tools / CI
        - Docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps to reproduce. Mention it if a test or drill already catches it.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build / version
      description: The version shown at the bottom of the title screen, or a commit or tag
