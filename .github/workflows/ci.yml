name: CI

on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: gates (syntax · dead-code · tests · economy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMBERFALL_SITE_ROOT: dist/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Release safety regressions
        run: npm run test:release

      - name: Build the release once
        run: npm run build:site

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sim unit tests (packages/sim, T-DET anchors)
        run: npm run test:sim

      - name: Syntax gate (check.sh)
        run: bash check.sh

      - name: Dead-code + load-order gate (deadscan --check)
        run: node deadscan.js --check

      - name: Economy model gate (econsim --json)
        run: node tools/econsim.js --json > /dev/null

      - name: Copy guard (truth-in-copy)
        run: node tools/copyguard.js

      - name: Rare-Sunday verdict math (wardenfall-check, pure)
        run: node tools/wardenfall-check.mjs

      - name: Browser suite (exact packaged release)
        run: npm run test:browser

      - name: Fun-curve scoreboard gate (snapshot sanity + README table agreement)
        run: node tools/fun-scoreboard.mjs --check

      - name: In-game self-test suite (?selftest, headless)
        run: node tools/selftest-ci.js

      - name: Verify the payload stayed unchanged during tests
        run: npm run verify:site

      - name: Retain tested release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: emberfall-site-${{ github.sha }}
          path: dist/site/
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - name: Publish measurements for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: measurements-${{ github.sha }}
          overwrite: true
          path: |
            docs/audit/timeline.json
            docs/audit/fun-loop.json
            test-results/
          if-no-files-found: warn
          retention-days: 14


  deploy:
    name: publish to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: emberfall-pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: emberfall-site-${{ github.sha }}
          path: dist/site

      - name: Verify the tested artifact before publishing
        run: node tools/site-payload.mjs verify

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  smoke-live:
    name: live smoke (published Pages payload)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: emberfall-site-${{ github.sha }}
          path: dist/site

      - name: Verify published payload
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          set -e
          # CDN propagation can briefly serve the previous release. Compare
          # every byte and MIME type to the retained artifact on each attempt.
          for i in $(seq 1 15); do
            if node tools/site-payload.mjs live "$URL"; then exit 0; fi
            sleep 3
          done
          echo 'Published Pages payload never matched the tested artifact'
          exit 1

  portal:
    name: portal build (size · hosts · zip root)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build the portal payload
        run: |
          set -euo pipefail
          npm run build:portal
          if [ ! -f dist-portal.zip ]; then
            echo "dist-portal.zip is missing after the portal build"
            exit 1
          fi

      - name: Zip is under 20 MB and index.html is at the root
        run: |
          set -euo pipefail
          test -f dist-portal/index.html
          if [ ! -f dist-portal.zip ]; then
            echo "dist-portal.zip is missing"
            exit 1
          fi
          size=$(stat -c%s dist-portal.zip)
          echo "dist-portal.zip bytes: $size"
          test "$size" -lt 20971520
          # names only; index.html must be a root entry, not nested
          unzip -Z1 dist-portal.zip | grep -x 'index.html' > /dev/null

      - name: Payload has no Supabase, fly.dev, or GitHub hosts
        run: |
          set -euo pipefail
          if grep -R -a -n -F -e 'supabase' -e 'fly.dev' -e 'github.com' dist-portal; then
            echo "forbidden host string in dist-portal"
            exit 1
          fi
          echo "portal payload: no supabase / fly.dev / github.com"
