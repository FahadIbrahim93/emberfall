name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: gates (syntax · dead-code · tests · smoke · economy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_PORT: 8123
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sim unit tests (packages/sim, T-DET anchors)
        run: npm run test:sim

      - name: Syntax gate (check.sh)
        run: bash check.sh

      - name: Dead-code + load-order gate (deadscan --check)
        run: node deadscan.js --check

      - name: Economy model gate (econsim --json)
        run: node tools/econsim.js --json > /dev/null

      - name: Copy guard (truth-in-copy)
        run: node tools/copyguard.js

      - name: Start Command Deck (detached)
        run: |
          PORT="$SERVER_PORT" node server.js > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$SERVER_PORT/api/health" > /dev/null 2>&1; then
              echo "deck up (pid $SERVER_PID)"; exit 0
            fi
            sleep 0.5
          done
          echo "server failed to start"; cat server.log; exit 1

      - name: API smoke (smoke.sh)
        run: bash smoke.sh

      - name: TRUST_PROXY limiter keys on the real client IP
        run: |
          TRUST_PROXY=1 PORT=8124 node server.js > server-trust.log 2>&1 &
          TRUST_PID=$!
          for i in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:8124/api/health" > /dev/null 2>&1 && break
            sleep 0.5
          done
          B1=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8124/api/register -H 'Content-Type: application/json' -H 'X-Emberfall: command-deck' -H 'X-Forwarded-For: 9.9.9.9' -d '{"name":"x","password":"y"}')
          B2=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8124/api/register -H 'Content-Type: application/json' -H 'X-Emberfall: command-deck' -H 'X-Forwarded-For: 9.9.9.9' -d '{"name":"x","password":"y"}')
          kill $TRUST_PID
          [ "$B1" = "400" ] && [ "$B2" = "400" ] || { echo "TRUST_PROXY path broken: $B1/$B2"; exit 1; }
          echo "TRUST_PROXY=1: XFF accepted as limiter/validation key path (bad-name 400 both times)"

      - name: Browser smoke
        run: npm run test:browser

      - name: In-game self-test suite (?selftest, headless)
        run: node tools/selftest-ci.js

      - name: Stop deck
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Server log on failure
        if: failure()
        run: tail -40 server.log

  deploy:
    name: publish to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble static site
        run: |
          mkdir -p _site/js _site/icons _site/fonts
          cp index.html sw.js manifest.webmanifest _site/
          cp js/*.js _site/js/
          cp icons/*.png _site/icons/
          cp fonts/*.woff2 _site/fonts/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  smoke-live:
    name: live smoke (published Pages payload)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify published payload
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          set -e
          up=0
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then up=1; break; fi
            sleep 3
          done
          [ "$up" = "1" ] || { echo "Pages URL never answered 200 (last: $code)"; exit 1; }
          echo "live: $URL"
          live=$(curl -fsS "$URL" | sha256sum | cut -d' ' -f1)
          want=$(git show HEAD:index.html | sha256sum | cut -d' ' -f1)
          echo "live sha $live · HEAD sha $want"
          [ "$live" = "$want" ] || { echo "DEPLOY MISMATCH: served index.html is not byte-identical to HEAD"; exit 1; }
          for f in sw.js manifest.webmanifest js/audio.js js/sky.js js/net.js js/art.js js/input.js icons/icon-192.png icons/icon-512.png fonts/michroma-400.woff2 fonts/chakra-petch-400.woff2 fonts/chakra-petch-500.woff2 fonts/chakra-petch-600.woff2 fonts/chakra-petch-700.woff2; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$URL$f")
            [ "$c" = "200" ] || { echo "MISSING $f -> $c"; exit 1; }
          done
          curl -fsS "$URL/sw.js" | grep -q 'emberfall-v' || { echo "sw.js missing cache marker"; exit 1; }
          curl -fsS "$URL/js/art.js" | grep -q 'ART v3' || { echo "js/art.js wrong payload"; exit 1; }
          echo "live smoke: byte-identical index · 14/14 shell assets · payload markers OK"
