name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: gates (syntax · dead-code · tests · economy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the fun-curve recorder may commit + push a newly-measured version's point
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sim unit tests (packages/sim, T-DET anchors)
        run: npm run test:sim

      - name: Syntax gate (check.sh)
        run: bash check.sh

      - name: Dead-code + load-order gate (deadscan --check)
        run: node deadscan.js --check

      - name: Economy model gate (econsim --json)
        run: node tools/econsim.js --json > /dev/null

      - name: Copy guard (truth-in-copy)
        run: node tools/copyguard.js

      - name: Rare-Sunday verdict math (wardenfall-check, pure)
        run: node tools/wardenfall-check.mjs

      - name: Browser suite (static server, tools/serve-static.mjs)
        run: npm run test:browser

      # The bot's own flight record is the fun curve: when the browser suite
      # just flew a NEW version for the first time on main, distill its
      # audited artifacts into the committed snapshot + README trend table
      # and commit (no loop: pushes made with GITHUB_TOKEN don't retrigger).
      # Runs only after the suite passed — a failed or flaked flight never
      # records a number.
      - name: Record the fun-curve point when the browser suite flew a new version (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node tools/fun-scoreboard.mjs
          if [ -n "$(git status --porcelain docs/audit/fun-curve.json README.md docs/press-kit.html)" ]; then
            git config user.name "emberfall-funbot"
            git config user.email "noreply@github.com"
            git add docs/audit/fun-curve.json README.md docs/press-kit.html
            git commit -m "fun-curve: record v$(grep -o '<span>EMBERFALL v[0-9.]*' index.html | grep -o '[0-9.]*') from the browser suite's audited play"
            git push
          else
            echo "fun-curve: no change — this version's point is already recorded"
          fi

      - name: Fun-curve scoreboard gate (snapshot sanity + README table agreement)
        run: node tools/fun-scoreboard.mjs --check

      - name: In-game self-test suite (?selftest, headless)
        run: node tools/selftest-ci.js


  deploy:
    name: publish to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble static site
        run: |
          mkdir -p _site/js _site/icons _site/fonts _site/docs/press
          cp index.html stats.html pilot.html sw.js manifest.webmanifest _site/
          cp js/*.js _site/js/
          cp icons/*.png _site/icons/
          cp fonts/*.woff2 _site/fonts/
          cp docs/press-kit.html _site/docs/
          cp docs/press/hero.png docs/press/emberfall-wave1.gif _site/docs/press/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  smoke-live:
    name: live smoke (published Pages payload)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify published payload
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          set -e
          up=0
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then up=1; break; fi
            sleep 3
          done
          [ "$up" = "1" ] || { echo "Pages URL never answered 200 (last: $code)"; exit 1; }
          echo "live: $URL"
          live=$(curl -fsS "$URL" | sha256sum | cut -d' ' -f1)
          want=$(git show HEAD:index.html | sha256sum | cut -d' ' -f1)
          echo "live sha $live · HEAD sha $want"
          [ "$live" = "$want" ] || { echo "DEPLOY MISMATCH: served index.html is not byte-identical to HEAD"; exit 1; }
          for f in sw.js manifest.webmanifest js/audio.js js/sky.js js/net.js js/art.js js/input.js icons/icon-192.png icons/icon-512.png fonts/michroma-400.woff2 fonts/chakra-petch-400.woff2 fonts/chakra-petch-500.woff2 fonts/chakra-petch-600.woff2 fonts/chakra-petch-700.woff2 docs/press-kit.html docs/press/hero.png docs/press/emberfall-wave1.gif; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$URL$f")
            [ "$c" = "200" ] || { echo "MISSING $f -> $c"; exit 1; }
          done
          curl -fsS "$URL/sw.js" | grep -q 'emberfall-v' || { echo "sw.js missing cache marker"; exit 1; }
          curl -fsS "$URL/js/art.js" | grep -q 'ART v3' || { echo "js/art.js wrong payload"; exit 1; }
          echo "live smoke: byte-identical index · 17/17 shell+press assets · payload markers OK"

  portal:
    name: portal build (size · hosts · zip root)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build the portal payload
        run: |
          set -euo pipefail
          npm run build:portal
          if [ ! -f dist-portal.zip ]; then
            echo "dist-portal.zip is missing after the portal build"
            exit 1
          fi

      - name: Zip is under 20 MB and index.html is at the root
        run: |
          set -euo pipefail
          test -f dist-portal/index.html
          if [ ! -f dist-portal.zip ]; then
            echo "dist-portal.zip is missing"
            exit 1
          fi
          size=$(stat -c%s dist-portal.zip)
          echo "dist-portal.zip bytes: $size"
          test "$size" -lt 20971520
          # names only; index.html must be a root entry, not nested
          unzip -Z1 dist-portal.zip | grep -qx 'index.html'

      - name: Payload has no Supabase, fly.dev, or GitHub hosts
        run: |
          set -euo pipefail
          if grep -R -a -n -F -e 'supabase' -e 'fly.dev' -e 'github.com' dist-portal; then
            echo "forbidden host string in dist-portal"
            exit 1
          fi
          echo "portal payload: no supabase / fly.dev / github.com"
