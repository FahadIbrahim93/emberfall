name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pages deploy publishes the static game only — server.js/data/ stay server-side
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: gates (syntax · dead-code · tests · smoke · economy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_PORT: 8123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax gate (check.sh)
        run: bash check.sh

      - name: Dead-code + load-order gate (deadscan --check)
        run: node deadscan.js --check

      # headless client suite: every JS-syntax pass re-runs the real game loop.
      # No DOM in Node — game code is covered by the smoke + server gates below.
      - name: Economy model gate (econsim --json)
        run: node tools/econsim.js --json > /dev/null

      - name: Start Command Deck (detached)
        run: |
          PORT="$SERVER_PORT" node server.js > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # wait for /api/health (up to ~20s)
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$SERVER_PORT/api/health" > /dev/null 2>&1; then
              echo "deck up (pid $SERVER_PID)"; exit 0
            fi
            sleep 0.5
          done
          echo "server failed to start"; cat server.log; exit 1

      - name: API + client-payload smoke (smoke.sh)
        run: bash smoke.sh

      - name: Stop deck
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Server log on failure
        if: failure()
        run: tail -40 server.log

  # the playable game is a fully static site (all asset paths relative), so
  # a green verify on main publishes it: index + js modules + PWA shell.
  # server.js and data/ are intentionally excluded — Pages is static-only.
  deploy:
    name: publish to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/js _site/icons
          cp index.html sw.js manifest.webmanifest _site/
          cp js/*.js _site/js/
          cp icons/*.png _site/icons/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
